# Backup collector. cron-job.org calls /api/cron/collect every hour (see
# docs/setup.md); this catches anything it misses. GitHub can start scheduled
# runs late or skip them, so it is not the main scheduler. Every 6 hours keeps
# a private repo far inside the 2,000 free Actions minutes a month.
# Needs the repository secret DATABASE_URL. Until it is set, the job skips.
name: Collect prices

on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check for the database secret
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npx prisma migrate deploy
      - if: steps.check.outputs.skip != 'true'
        run: npm run collect
