# Fetch the TSM price files every 2 hours and store any new scan. TSM
# republishes about every 3 hours; every 2 keeps a private repo well inside
# GitHub's 2,000 free Actions minutes a month.
# Needs the repository secret DATABASE_URL. Until it is set, the job skips.
name: Collect prices

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check for the database secret
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.skip != 'true'
        run: npm ci
      - if: steps.check.outputs.skip != 'true'
        run: npx prisma migrate deploy
      - if: steps.check.outputs.skip != 'true'
        run: npm run collect
